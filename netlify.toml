# Netlify configuration for the Next.js frontend.
#
# This repo is a backend/ + frontend/ monorepo, so the build runs in
# `frontend` and publishes the Next.js output.
#
# The Next.js Runtime (`@netlify/plugin-nextjs`) is declared explicitly below.
# Without it Netlify treats the build as a static site and publishes the raw
# `.next` directory: `/BUILD_ID` and `/server/app/page.js` become downloadable
# and every real route answers 404. Do not remove the plugin block.
#
# Connect this repository in Netlify (or run `netlify deploy --build`) rather
# than dragging the folder into "Deploy manually": a manual deploy copies files
# verbatim, never runs `next build`, and therefore serves source files with no
# page at `/` (a 404).
#
# Set `NEXT_PUBLIC_API_URL` in Site configuration → Environment variables to
# the public API base, e.g. https://your-api.onrender.com/api/v1. Without it the
# browser falls back to http://localhost:5000 and every call fails on the
# deployed site.

[build]
  base = "frontend"
  command = "npm run build"
  # The runtime consumes `.next` and emits Netlify Functions + edge routing.
  # A plain static publish of this directory (no plugin) is what produced the
  # downloadable `/server/app/page.js` and the 404s on every route.
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

# The Next.js Runtime / OpenNext adapter. It turns the build into Netlify
# Functions (SSR, route handlers, server actions) plus edge routing. Declared
# here instead of relying on framework auto-detection.
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
